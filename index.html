<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>BabyFood</title>

  <meta name="theme-color" content="#F6F2EB">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="BabyFood">
  <meta name="description" content="Recetas, planificación y seguimiento de alimentación complementaria.">

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="splash-screen">
    <img src="./assets/splash.png" alt="BabyFood">
  </div>

  <div id="app" class="hidden">
    <header class="top-header">
      <h1>BabyFood</h1>
      <span class="header-dot" aria-hidden="true"></span>
    </header>

    <main id="content"></main>

    <nav class="bottom-nav" aria-label="Navegación principal">
      <button class="nav-btn active" data-section="inicio" aria-label="Inicio">
        <span class="nav-icon">⌂</span>
        <span>Inicio</span>
      </button>

      <button class="nav-btn" data-section="recetas" aria-label="Recetas">
        <span class="nav-icon">◫</span>
        <span>Recetas</span>
      </button>

      <button class="center-btn" data-section="registro" aria-label="Registrar comida">+</button>

      <button class="nav-btn" data-section="plan" aria-label="Plan semanal">
        <span class="nav-icon">▦</span>
        <span>Plan</span>
      </button>

      <button class="nav-btn" data-section="perfil" aria-label="Perfil">
        <span class="nav-icon">○</span>
        <span>Perfil</span>
      </button>
    </nav>
  </div>

  <script src="app.js"></script>
  <script src="enhancements.js"></script>
</body>
</html>
