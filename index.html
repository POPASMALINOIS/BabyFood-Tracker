<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>BabyFood Tracker</title>

  <meta name="theme-color" content="#F7EFE8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="BabyFood">

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div id="splash-screen">
    <img src="./assets/splash.png" alt="BabyFood Tracker">
  </div>

  <div id="app" class="hidden">

    <header class="top-header">
      <div class="app-pill">BLW · Purés · Recetas · Alérgenos</div>
      <h1>BabyFood</h1>
      <p>Control familiar de alimentación complementaria, recetas y evolución.</p>
    </header>

    <main id="content"></main>

    <nav class="bottom-nav">
      <button class="nav-btn active" data-section="inicio">
        <span class="nav-icon">⌂</span>
        <span>Inicio</span>
      </button>

      <button class="nav-btn" data-section="recetas">
        <span class="nav-icon">🍽</span>
        <span>Recetas</span>
      </button>

      <button class="center-btn" data-section="registro">+</button>

      <button class="nav-btn" data-section="alergenos">
        <span class="nav-icon">!</span>
        <span>Alérgenos</span>
      </button>

      <button class="nav-btn" data-section="perfil">
        <span class="nav-icon">👶</span>
        <span>Perfil</span>
      </button>
    </nav>

  </div>

  <script src="app.js"></script>
</body>
</html>
